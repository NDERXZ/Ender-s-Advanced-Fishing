# Rewards for fishing locations
# These rewards are given when admins create fishing locations

# Global settings
settings:
  enable_rewards: true
  
# Admin rewards - given to the admin who creates the location
admin_rewards:
  # Default reward for creating any location
  default:
    commands:
      - "give %player% diamond 1"
      - "tell %player% Thank you for creating a new fishing ground!"
    money: 5000
    exp: 500
    
  # Rewards based on location size (radius)
  by_size:
    small:  # radius < 30
      commands:
        - "give %player% emerald 1"
      money: 2500
      exp: 250
    medium:  # 30 <= radius < 80
      commands:
        - "give %player% emerald 3"
      money: 5000
      exp: 500
    large:  # radius >= 80
      commands:
        - "give %player% emerald 5"
        - "give %player% diamond_block 1"
      money: 10000
      exp: 1000
      
# Server-wide rewards - announced and potentially available to all players
server_rewards:
  enable: true
  announce_message: "§a§l[NEW FISHING GROUND] §f%admin% created a new fishing spot: §b%location_name%§f at §e%x%§f, §e%z%"
  teleport_command: "/eaf location tp %location_id%"
  broadcast_commands:
    - "broadcast A new fishing ground is open! Type /eaf location tp %location_id% to visit!"