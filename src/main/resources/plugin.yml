name: EndersAdvancedFishing
main: com.ender.advancedfishing.EndersAdvancedFishing
version: ${version}
website: https://github.com/Ender/EndersAdvancedFishing
author: "Ender"
api-version: '1.21'
softdepend: [Vault, PlaceholderAPI, Nexo, Oraxen, ItemsAdder, AuraSkills]

commands:
  eaf:
    description: Main command for Ender's Advanced Fishing plugin
    aliases: [endersfishing, fishing, nusafishing, nf]
    usage: /eaf help

permissions:
  eaf.rod:
    description: Permission to give custom fishing rods
    default: op
  eaf.bait:
    description: Permission to give custom fishing baits
    default: op
  eaf.afk:
    description: Permission to use automated AFK fishing
    default: true
  eaf.journal:
    description: Permission to open Fish Journal and Codex
    default: true
  eaf.chum:
    description: Permission to give Chum Buckets
    default: op
  eaf.admin:
    description: Administrator permission for all features
    default: op
    children:
      eaf.admin.reload: true
      eaf.admin.event: true
      eaf.admin.tournament: true
      eaf.rod: true
      eaf.bait: true
      eaf.repair: true
      eaf.sell: true
      eaf.shop: true
      eaf.afk: true
      eaf.collector: true
      eaf.journal: true
      eaf.chum: true
  eaf.admin.reload:
    description: Permission to reload plugin configuration
    default: op
  eaf.admin.event:
    description: Izin untuk mengelola event memancing
    default: op
  eaf.repair:
    description: Izin untuk memperbaiki pancingan custom
    default: true
  eaf.sell:
    description: Izin untuk menjual ikan
    default: true
  eaf.shop:
    description: Izin untuk menggunakan toko
    default: true
  eaf.collector:
    description: Izin untuk menggunakan kolektor ikan mistik
    default: true
  eaf.admin.tournament:
    description: Izin untuk mengelola turnamen memancing
    default: op
